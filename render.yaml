
services:
  - type: web
    name: okx-smart-trading-v1
    runtime: python
    plan: free

    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8

      - key: APP_ENV
        value: production

      - key: WEB_CONCURRENCY
        value: "1"

      - key: APP_SECRET_KEY
        generateValue: true

      - key: ADMIN_API_KEY
        generateValue: true

      - key: TIMEZONE
        value: Asia/Taipei

      - key: SCAN_INTERVAL_SECONDS
        value: "3600"

      - key: TOP_N_SYMBOLS
        value: "20"

      - key: ENABLE_BACKGROUND_SCHEDULER
        value: "false"

      - key: MIN_SIGNAL_SCORE
        value: "60"

      - key: ENABLE_LONG
        value: "true"

      - key: ENABLE_SHORT
        value: "true"

      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false

      - key: LINE_CHANNEL_SECRET
        sync: false

      - key: LINE_TO_USER_ID
        sync: false

      - key: LINE_ENABLED
        value: "false"

      - key: DATABASE_URL
        sync: false

      - key: DATABASE_PATH
        value: data/okx_trading.db

      - key: DATABASE_CONNECT_TIMEOUT
        value: "15"

      - key: SUMMARY_HOUR
        value: "21"
